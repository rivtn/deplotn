
name: "deplotn"
description: "Seamless cloud deployment. (Docker, VM, Dokku) By Rivtn"
author: |
  "Adewale Azeez <iamthecarisma@gmail.com>"

inputs:
  # app
  app-name: 
    description: "The name of your application after deployment"
    required: true
  verbose: 
    description: "Print out as much log as possible for debugging"
    required: false
  # environment
  environment: 
    description: "Deployment environment"
    required: true
  environment-output: 
    description: "Flag to indicate to resolve and output repo variables"
    required: true
  environment-vars:
    description: "The list of variables to process and output for subsequent actions"
    required: true
    default: |
        DOKKU_CONFIGS
  environment-vars-read-prefix:
    description: "The prefix for the environment variable when reading from inputs if available, e.g. UAT_, ${environment}_"
    required: false
  environment-vars-write-prefix:
    description: "The prefix for the environment variable when writing to output if available, e.g. UAT_, ${environment}_"
    required: false
  environment-casing:
    description: "Letter casing for the environment variables, options are UPPER, LOWER, NONE"
    default: "UPPER"
    required: false
  # docker setup
  dockerize: 
    description: "Flag to indicate if to build a docker image if a Dockerfile is in the project"
    required: false
    default: false
  dockerfile: 
    description: "The path to the Dockerfile for building the docker image"
    default: "Dockerfile"
    required: false
  docker-registry-host: 
    description: "Docker registry to push the built docker image"
    required: false
  docker-registry-username: 
    description: "Docker registry username"
    required: false
  docker-registry-password: 
    description: "Docker registry password"
    required: false
  docker-project-env-path: 
    description: "The project .env path"
    default: ".env"
    required: false
  docker-write-env-vars: 
    description: "The variables to put in the .env file in the Dockerfile project root"
    required: false
    default: |
        DOKKU_CONFIGS
  docker-image-tag: 
    description: "Docker image tag"
    required: false
  docker-image-namespace: 
    description: "Docker image name space"
    required: false
  environment-is-image-namespace: 
    description: "Flag to indicate if the environment value is the same as the docker image name space"
    required: false
  # ssh setup
  ssh-host: 
    description: "The SSH server host"
    required: false
  ssh-port: 
    description: "The SSH server port"
    required: false
  ssh-username: 
    description: "The SSH server username"
    required: false
  ssh-password: 
    description: "The SSH server password"
    required: false
  ssh-passphrase: 
    description: "The SSH server passphrase"
    required: false
  ssh-privatekey: 
    description: "The SSH server privatekey"
    required: false
  ssh-commands: 
    description: "Commands to execute in the ssh shell"
    required: false
  ssh-runtime-minutes: 
    description: "Force close the ssh after the specified minutes to prevent indefinite pipeline execution"
    required: false
    default: 10
  ssh-expose-vars: 
    description: "The variables to expose to the ssh shell"
    required: false
    default: |
        DOKKU_CONFIGS
  dokku-deploy: 
    description: "Flag to indicate if to deploy to vm using dokku"
    required: false
    default: false
  dokku-environment-vars: 
    description: "Environment variable for the deployed dokku app"
    required: false
  dokku-app-name: 
    description: "The app name for dokku app deployment, e.g dokku-app-name=example domain is example.base-domain, defaults to app-name or APP_NAME variable"
    required: false
  dokku-base-domain: 
    description: "Base domain for dokku app deployment, e.g dokku-base-domain=example.com domain is app-name.example.com, defaults to base-domain or BASE_DOMAIN variable"
    required: false
  dokku-environment: 
    description: "The environment to prefix to base domain for dokku app, e.g dokku-environment=prod domain is app-name.prod.base-domain, defaults to environment or ENVIRONMENT variable"
    required: false
  dokku-container-port: 
    description: "Container port to export for connection"
    required: false
  dokku-registry-host: 
    description: "Docker registry to pull the dokku image for deployment, default to registry-host or REGISTRY_HOST variable"
    required: false
  dokku-setup-ssl: 
    description: "Flag to indicate to configure the SSL using letsencrypt dokku plugin"
    required: false
  dokku-domains: 
    description: "The domains to configure for the dokku app"
    required: false

outputs:
  env-setup-completed:
    description: "The environment setup was completed successfully"

runs:
  using: 'node24'
  main: 'index.js'